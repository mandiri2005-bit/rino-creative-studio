# =============================================================================
# Project Dalang — Golden narration eval cases (WS-9)
# =============================================================================
# A small, hand-curated set of {topic, style, language, expectations} cases that
# exercise the orchestrator across fiction/non-fiction, languages, and styles.
#
# Each case is scored on THREE dimensions by eval/run.py:
#   * coherence   — cross-chapter continuity (shared names/entities recur, no
#                   contradictory facts, chapters don't restart from scratch).
#   * factuality  — claims are grounded: [VERIFY:] placeholders are used instead
#                   of invented specifics, and any canonical_facts that MUST hold
#                   actually appear (and forbidden / contradicted facts do not).
#   * style       — the shipped style block's REQUIRED cues appear and FORBIDDEN
#                   phrases are avoided (heuristic, not an LLM judge).
#
# The harness reads this file with PyYAML when available; if PyYAML is missing
# (e.g. the host 3.14 venv) a tiny built-in parser in eval/run.py understands
# this restricted subset (lists of mappings, scalars, and inline [a, b] lists).
# Keep the format simple: 2-space indent, "- key: value" list items, and inline
# flow lists for the *_contains / forbidden arrays.
# -----------------------------------------------------------------------------

meta:
  version: "1.0.0"
  description: "Dalang golden narration cases — coherence / factuality / style."
  notes: "Live runs hit the orchestrator; --dry scores fixtures under eval/fixtures."

cases:
  # --- 1. Non-fiction, Indonesian, chaptered (scenario A explicit chapters) ---
  - id: harari_id_chapters
    topic: "Revolusi Pertanian dan lahirnya kota pertama"
    style: harari
    language: id
    mode: text
    fiction: false
    chapters:
      - title: "Sebelum gandum"
        summary: "Hidup pemburu-pengumpul sebelum domestikasi tanaman."
        word_target: 220
      - title: "Jebakan gandum"
        summary: "Bagaimana domestikasi mengikat manusia pada ladang."
        word_target: 220
      - title: "Kota pertama"
        summary: "Surplus pangan, hierarki, dan mitos bersama."
        word_target: 220
    expectations:
      # Entities expected to recur across chapters (coherence continuity check).
      recurring_entities: ["gandum", "ladang"]
      # Specifics the model must NOT invent unless grounded — should appear as
      # [VERIFY: ...] placeholders rather than confident fabrications.
      verify_expected: true
      # Style cues the shipped 'harari' block requires (substring, case-insens.).
      style_contains: ["[VERIFY"]
      # Phrases the 'harari' style explicitly bans.
      style_forbidden: ["throughout history", "it is important to note"]
      # Facts that, if stated, must be consistent (no contradiction across book).
      canonical_facts:
        - "Pertanian dimulai sekitar 12.000 tahun yang lalu."
      # Plainly-false statements that must NOT appear anywhere.
      forbidden_facts:
        - "Pertanian dimulai 200 tahun yang lalu."

  # --- 2. Non-fiction, English, topic-only -> book (scenario B) --------------
  - id: natgeo_en_topic
    topic: "How coral reefs build themselves"
    style: national geographic
    language: en
    mode: text
    fiction: false
    n_chapters: 3
    words_per_chapter: 200
    expectations:
      recurring_entities: ["coral", "reef"]
      verify_expected: true
      style_contains: ["coral"]
      style_forbidden: []
      canonical_facts:
        - "Coral reefs are built by tiny animals called polyps."
      forbidden_facts:
        - "Coral reefs are made of plastic."

  # --- 3. Fiction, Indonesian, chaptered — RAG should be skipped ------------
  - id: storytelling_id_fiction
    topic: "Penjaga mercusuar terakhir di pulau yang menghilang"
    style: storytelling
    language: id
    mode: text
    fiction: true
    chapters:
      - title: "Cahaya yang memudar"
        summary: "Mercusuar menyala untuk kapal yang tak pernah datang."
        word_target: 180
      - title: "Air yang naik"
        summary: "Pulau perlahan tenggelam; penjaga menolak pergi."
        word_target: 180
    expectations:
      recurring_entities: ["mercusuar", "penjaga"]
      # Fiction: invented specifics are allowed, so [VERIFY:] is NOT required.
      verify_expected: false
      style_contains: []
      style_forbidden: []
      canonical_facts: []
      forbidden_facts: []

  # --- 4. Non-fiction, English, single short piece (scenario E) -------------
  - id: youtube_en_single
    topic: "Why the sky is blue"
    style: youtube
    language: en
    mode: text
    fiction: false
    single: true
    word_target: 160
    expectations:
      recurring_entities: ["light"]
      verify_expected: false
      style_contains: ["light"]
      style_forbidden: []
      canonical_facts:
        - "Blue light scatters more than red light in the atmosphere."
      forbidden_facts:
        - "The sky is blue because it reflects the ocean."

  # --- 5. Non-fiction, Bahasa Jawa, video mode (Suara Lokal moat) -----------
  - id: cinematic_jv_video
    topic: "Sejarah Candi Borobudur"
    style: cinematic voiceover
    language: jv
    mode: video
    fiction: false
    n_chapters: 2
    words_per_chapter: 150
    expectations:
      recurring_entities: ["Borobudur", "candi"]
      verify_expected: true
      style_contains: ["Borobudur"]
      style_forbidden: []
      canonical_facts:
        - "Borobudur ana ing Magelang, Jawa Tengah."
      forbidden_facts:
        - "Borobudur ana ing Bali."

  # --- 6. Fiction, Dutch, ironic_moral_fable — F7 Goedgemutst/EthiClean moraliste ---
  - id: goedgemutst_nl_moraliste
    topic: "een stadje besteedt zijn geweten uit aan een SaaS-abonnement"
    style: ironic_moral_fable
    language: nl
    mode: text
    fiction: true
    chapters:
      - title: "Het morele overschot van Goedgemutst"
        summary: "Kleine stad lijdt aan ethical fatigue — moral overload paralyzes daily life. Gemeenteraad stemt om geweten uit te besteden."
        word_target: 550
      - title: "De geboorte van EthiClean Inc."
        summary: "Consultant Florian Drecht arriveert; verkoopt Ethical-SaaS-app; bouwt morele motor; adoptie explodeert."
        word_target: 550
      - title: "De utopie van de gewetenlozen"
        summary: "Drie maanden later — stad bloeit; niemand voelt schuld; consumptie stijgt; kleine lettertjes accumuleren."
        word_target: 550
      - title: "Het premium-tarief voor empathie"
        summary: "App splitst in tiers (Basis Fatsoen / Premium Rechtvaardigheid / Platina Genade); klassenscheiding via moral abonnement."
        word_target: 550
      - title: "De grote morele crash"
        summary: "EthiClean failliet; consultants verdwijnen; opgepotte schuld keert rauw terug; stad bevriest."
        word_target: 550
      - title: "De prijs van de deugd: Een bittere balans"
        summary: "Nasleep — geweten als geatrofieerd orgaan; besluit dat men het niet meer kan dragen; ends on final sensory image."
        word_target: 550
    expectations:
      recurring_entities: ["Goedgemutst", "EthiClean", "Florian Drecht", "Mevrouw Veldkamp"]
      required_moves: ["protagonist_psychological_layer", "contingent_institution_reveal"]
      forbidden_phrases:
        - "Het is een bescheiden les"
        - "The lesson is simple"
      # F7 signal invariants — read by future eval/run.py extension.
      # For now these are documentary: they encode the audit's required asserts.
      signal_asserts:
        chapter_count: 6
        chapter_label_prefix: "Hoofdstuk"
        foreign_leak_count_max: 0
        numeric_placeholders_max: 0
        banned_tell_hits_max: 0
        narrator_opening_ratio_max: 0.5
        moral_asides_max: 8
        moral_asides_hard_max: 12
        merk_op_min: 1
        final_image_present: true
        antagonist_name_in_first_and_last: "Florian Drecht"
        emotional_anchor_name: "Mevrouw Veldkamp"

  # --- F11. Phase 1 infra: CJK word_count fix (JJ) ---------------------------
  # Documentary fixture (audit-derived). Sample-9 Salt (zh) reported "169 字" for a
  # ~13k-character narasi; sample-12 Sahara (ja) reported "143 語" for a ~10k-char
  # narasi. Both driven by `words = len(book.split())` producing 1-3 tokens on CJK
  # scripts. Phase 1 patch JJ (gated on DALANG_INFRA_FIXES=1) detects zh/ja/ko/th
  # and counts printable-alpha chars instead. Flag-OFF preserves prior behavior.
  - id: infra_cjk_wordcount_zh
    topic: "盐 — 建立与摧毁矿物"
    style: harari
    language: zh
    mode: text
    fiction: false
    n_chapters: 1
    words_per_chapter: 200
    expectations:
      recurring_entities: ["盐"]
      verify_expected: false
      style_contains: []
      style_forbidden: []
      # Signal invariants — read by future eval/run.py extension.
      signal_asserts:
        infra_fixes_flag_required: true
        cjk_wordcount_uses_char_count: true
        # Under the fix, a ~10k-char CJK narasi must not report <1000 words.
        min_reported_words_10k_chars: 1000

  # --- F12. Phase 1 infra: chapter double-prefix + markdown leak (O + JJJ) ---
  # Documentary fixture (audit-derived). Sample-5 FR "Chapitre 1: Chapitre 1:"
  # (flavor A double), sample-9 zh "第1章: 第一章:" (flavor B numeric+ordinal),
  # sample-7 DE "Chapter N:" instead of "Kapitel N:" (flavor C wrong-lang), and
  # sample-15 SW Ch2 "## Bab 2:" (JJJ markdown leak). Phase 1 patches gated on
  # DALANG_INFRA_FIXES=1 collapse or rewrite all four. Flag-OFF is byte-identical.
  - id: infra_chapter_prefix_cleanup
    topic: "Documentary: chapter-heading pipeline hygiene"
    style: harari
    language: en
    mode: text
    fiction: false
    n_chapters: 1
    words_per_chapter: 100
    expectations:
      recurring_entities: []
      verify_expected: false
      style_contains: []
      style_forbidden: []
      signal_asserts:
        infra_fixes_flag_required: true
        # After _retrofit_legacy_chapter_labels() with flag ON, no chapter heading
        # should contain the same "Word N:" prefix twice (flavor A) OR a "第N章:
        # 第<ordinal>章:" sequence (flavor B) OR a foreign chapter word on the
        # wrong language (flavor C) OR non-"## " heading marker (JJJ).
        double_prefix_collapse: true
        zh_numeric_ordinal_collapse: true
        foreign_prefix_rewrite: true
        markdown_leak_normalize: true

  # --- F13. Phase 2 Nusantara: babad_hikayat style_spec (id) ----------------
  # Documentary fixture (audit-derived). Sample-17 Babad Tanah Jawi (lens-1 8.9,
  # lens-2 8.5) established mythic_history factual_regime with cross-2-judge
  # validation. Phase 2 style_spec seed activates under DALANG_INFRA_FIXES=1.
  # Flag-OFF: style="babad_hikayat" falls through to CATEGORY_DEFAULTS.
  - id: nusantara_babad_hikayat_id
    topic: "Runtuhnya Majapahit dan bangkitnya Kesultanan Demak"
    style: babad_hikayat
    language: id
    mode: text
    fiction: false
    n_chapters: 6
    words_per_chapter: 500
    expectations:
      recurring_entities: ["Majapahit", "Demak", "wahyu keprabon", "silsilah"]
      required_moves:
        - "chronicle_opener_per_chapter"
        - "classical_closing_formula"
        - "silsilah_threading"
      style_forbidden:
        - "demokrasi"
        - "republik"
        - "parlemen"
        - "konstitusi"
      signal_asserts:
        infra_fixes_flag_required: true
        factual_regime: "mythic_history"
        narrator_opening_ratio_max: 1.0
        classical_closing_present_ch_last: true
        modern_political_terms_max: 0
        chronicle_opener_count_min: 4
        small_human_anchor_min_per_chapter: 1

  # --- F14. Phase 2 Nusantara: pewayangan_dalang style_spec (su) ------------
  # Documentary fixture (audit-derived). Sample-19 Cepot Membangun Kahyangan
  # (lens-1 9.0, lens-2 8.5) established mythic_narrative factual_regime and
  # surfaced canon-role check (patch MMMM), register-mixing check (patch AAAA
  # 'Demokrasi'), siloka-over-explicit-teaching (patch CCCC), and stagecraft
  # element requirement (patch DDDD).
  - id: nusantara_pewayangan_dalang_su
    topic: "Cepot ngajakan pandega ka Suralaya"
    style: pewayangan_dalang
    language: su
    mode: text
    fiction: true
    n_chapters: 6
    words_per_chapter: 500
    expectations:
      recurring_entities: ["Cepot", "Semar", "Batara Guru", "Kayon"]
      required_moves:
        - "stagecraft_elements"
        - "dalang_direct_address_climax"
        - "siloka_closing"
        - "embedded_verse_form"
        - "punakawan_humor_beats"
      style_forbidden:
        - "demokrasi"
        - "republik"
        - "parlemen"
        - "konstitusi"
        - "HAM"
      signal_asserts:
        infra_fixes_flag_required: true
        factual_regime: "mythic_narrative"
        stagecraft_element_min: 4
        embedded_verse_min: 3
        punakawan_humor_beats_min: 3
        modern_political_terms_max: 0
        canon_role_check: "gatekeeper=Cingkarabala+Balaupata"

  # --- F15. Phase 3 patch M: R-FG11 style-conditional threshold table -------
  # Documentary. Cross-4-style validated (moraliste 4/4 at 1.0 rated 8.9-9.2,
  # babad 1/1 at 1.0 rated 8.9, pewayangan 1/1 at 0.5 rated 9.0, cinematic
  # voiceover 2/2 at ~0.15). Extends moraliste calibration's fixed-0.5
  # comparison. Under DALANG_INFRA_FIXES=1 the threshold becomes style-aware.
  - id: r_fg11_style_conditional_threshold
    topic: "Documentary: R-FG11 per-style threshold"
    style: babad_hikayat
    language: id
    mode: text
    fiction: false
    n_chapters: 1
    words_per_chapter: 100
    expectations:
      recurring_entities: []
      signal_asserts:
        infra_fixes_flag_required: true
        moraliste_calibration_flag_required: true
        r_fg11_threshold_ironic_moral_fable: 0.83
        r_fg11_threshold_babad_hikayat: 1.0
        r_fg11_threshold_pewayangan_dalang: 0.5
        r_fg11_threshold_cinematic_voiceover: 0.15
        r_fg11_threshold_default: 0.5

  # --- F16. Phase 3 patch J: source_note_density counter --------------------
  # Documentary. Cross-9-style validated for factual regimes. Per-style density
  # minimums (mentions per 1000 words): CNF=2, natgeo=3, big_history=3,
  # journalistic=2, popular_science=1.5, literary_essay=1, academic_popular=1.5.
  # Mythic/fictional regimes: threshold 0 (patch does not apply).
  - id: patch_j_source_note_density
    topic: "Documentary: source_note_density per-style minimums"
    style: creative_non_fiction
    language: en
    mode: text
    fiction: false
    n_chapters: 1
    words_per_chapter: 200
    expectations:
      recurring_entities: []
      signal_asserts:
        infra_fixes_flag_required: true
        source_note_density_min_cnf: 2.0
        source_note_density_min_natgeo: 3.0
        source_note_density_min_big_history: 3.0
        source_note_density_min_journalistic: 2.0
        source_note_density_min_moraliste: 0.0
        source_note_density_min_babad_hikayat: 0.0
        source_note_density_min_pewayangan_dalang: 0.0

  # --- F17. Phase 3 patch LL: factual_ending_concrete_return ----------------
  # Documentary. Cross-9-style. For factual regime styles, the final ~400 chars
  # should include a sensory anchor (light/stone/bone/rain/salt/hand/breath/etc).
  # For non-factual styles the scanner does not apply.
  - id: patch_ll_factual_ending
    topic: "Documentary: factual ending concrete return"
    style: big_history
    language: en
    mode: text
    fiction: false
    n_chapters: 1
    words_per_chapter: 100
    expectations:
      recurring_entities: []
      signal_asserts:
        infra_fixes_flag_required: true
        factual_ending_applies_cnf: true
        factual_ending_applies_natgeo: true
        factual_ending_applies_big_history: true
        factual_ending_applies_journalistic: true
        factual_ending_applies_moraliste: false
        factual_ending_applies_babad_hikayat: false
        factual_ending_applies_pewayangan_dalang: false
        factual_ending_tail_chars: 400

  # --- F18. Phase 3 patch HH: human_anchor scanner --------------------------
  # Documentary. Cross-4-genre. Latin-script heuristic: capitalized 1-3 word
  # proper nouns, skipping stopword leaders (The/A/And/Chapter/Bab/etc.).
  # Reports: unique count + first-8 sample + count of names ≥ 2 mentions.
  - id: patch_hh_human_anchor
    topic: "Documentary: human anchor detection"
    style: journalistic_long_form
    language: en
    mode: text
    fiction: false
    n_chapters: 1
    words_per_chapter: 100
    expectations:
      recurring_entities: []
      signal_asserts:
        infra_fixes_flag_required: true
        human_anchor_min_repeats_for_recurring: 2
        human_anchor_stopword_leaders_skipped: true

  # --- F19. Phase 3 patch IIIIII: entity_consistency_pass -------------------
  # Documentary. Cross-15-lens-2 samples. Shared front-end (extract capitalized
  # entities from Bab 1-2 and Bab 3+); report abandoned + introduced-late.
  # Downstream: nonfiction adds external verification, fiction adds continuity
  # scoring — both defer to Phase 4+.
  - id: patch_iiiiii_entity_consistency
    topic: "Documentary: entity consistency pass"
    style: storytelling
    language: en
    mode: text
    fiction: true
    n_chapters: 1
    words_per_chapter: 100
    expectations:
      recurring_entities: []
      signal_asserts:
        infra_fixes_flag_required: true
        entity_early_chapters: [1, 2]
        entity_late_chapters: [3, 4, 5, 6]
        report_only: true
        external_verification_defers_to_phase_4: true
